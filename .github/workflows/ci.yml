name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  ci:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      # Optional: E2E smoke (requires a running dev server + browser install).
      # Enable in a follow-up if you add a preview deployment or local server step.
      # - name: Install Playwright browsers (for qa-smoke)
      #   run: pnpm exec playwright install --with-deps
      # - name: Run qa smoke (example)
      #   run: pnpm qa:smoke
      #   env:
      #     BASE_URL: http://localhost:3000
